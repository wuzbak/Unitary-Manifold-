# EIGE v21.0 — Nginx Dashboard Configuration
# Public-facing real-time verification dashboard (static + WebSocket proxy)
#
# AxiomZero Technologies & Consulting, SPC
# Theory & scientific direction: ThomasCory Walker-Pearson
# Code architecture & synthesis:  GitHub Copilot (AI)

# Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name eige.wa.gov;
    return 301 https://$server_name$request_uri;
}

# Main TLS server
server {
    listen 443 ssl http2;
    server_name eige.wa.gov;

    # TLS configuration (certificates provisioned via cert-manager / Let's Encrypt)
    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.3;
    ssl_ciphers         TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' wss://eige.wa.gov; img-src 'self' data:; style-src 'self' 'unsafe-inline';" always;

    root /var/www/eige-dashboard;
    index index.html;

    # Next.js static dashboard
    location / {
        try_files $uri $uri.html $uri/ /index.html;
        expires 5m;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=60";
    }

    # API proxy → state mesh HTTP API
    location /api/v1/ {
        proxy_pass http://eige-state-mesh-svc:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
    }

    # WebSocket proxy → state-feed live telemetry
    location /ws/ {
        proxy_pass http://eige-state-mesh-svc:8081/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;   # Keep WebSocket alive for up to 24h
        proxy_send_timeout 86400s;
    }

    # Public OSCAL dossier logs (read-only static JSON cache)
    location /public/dossiers/ {
        alias /var/eige/public-dossiers/;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
    }

    # Health endpoint (for K8s ingress probes)
    location /healthz {
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
