hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "androidx-hilt" }
hilt-work-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "androidx-hilt" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
camera-core = { module = "androidx.camera:camera-core", version.ref = "camera" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camera" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camera" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
mlkit-translate = { module = "com.google.mlkit:translate", version = "17.0.2" }
mlkit-language-id = { module = "com.google.mlkit:language-id", version = "17.0.5" }
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version = "16.0.0" }
mlkit-objectdetection = { module = "com.google.mlkit:object-detection", version = "17.0.1" }
gson = { module = "com.google.code.gson:gson", version = "2.10.1" }
zxing-core = { module = "com.google.zxing:core", version = "3.5.3" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "4.12.0" }
