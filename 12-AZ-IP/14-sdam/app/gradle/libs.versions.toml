[versions]
agp                      = "8.3.2"
kotlin                   = "1.9.23"
compose-bom              = "2024.04.01"
compose-compiler         = "1.5.12"
hilt                     = "2.51"
hilt-navigation-compose  = "1.2.0"
datastore                = "1.1.1"
coroutines               = "1.8.0"
navigation-compose       = "2.7.7"
material3                = "1.12.0"
junit                    = "4.13.2"
mockk                    = "1.13.10"
minSdk                   = "26"
compileSdk               = "34"
targetSdk                = "34"

[libraries]
# AndroidX
androidx-core-ktx                    = { group = "androidx.core",      name = "core-ktx",                      version = "1.13.1" }
androidx-lifecycle-runtime-ktx       = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",          version = "2.7.0"  }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose",    version = "2.7.0"  }
androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",      version = "2.7.0"  }
androidx-activity-compose            = { group = "androidx.activity",  name = "activity-compose",               version = "1.9.0"  }

# Material (View-system Material3 — required for Theme.Material3.* XML themes)
material = { group = "com.google.android.material", name = "material", version.ref = "material3" }

# Compose BOM
compose-bom                    = { group = "androidx.compose", name = "compose-bom",              version.ref = "compose-bom" }
compose-ui                     = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling             = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview     = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3              = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Navigation
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }

# Hilt
hilt-android           = { group = "com.google.dagger", name = "hilt-android",            version.ref = "hilt" }
hilt-compiler          = { group = "com.google.dagger", name = "hilt-compiler",            version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt",   name = "hilt-navigation-compose",  version.ref = "hilt-navigation-compose" }

# DataStore
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Coroutines
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library     = { id = "com.android.library",     version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-kapt         = { id = "org.jetbrains.kotlin.kapt",    version.ref = "kotlin" }
hilt-android        = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
