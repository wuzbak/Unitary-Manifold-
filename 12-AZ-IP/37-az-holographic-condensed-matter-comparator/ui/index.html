<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AZ Holographic Condensed-Matter Comparator — Product 37</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
  .epistemic { background: #fff3cd; border: 1px solid #e0b000; padding: 0.75rem 1rem; border-radius: 6px; }
  pre { background: #0d1117; color: #c9d1d9; padding: 1rem; border-radius: 6px; overflow-x: auto; }
  button { margin-right: 0.5rem; }
</style>
</head>
<body>
<h1>AZ Holographic Condensed-Matter Comparator</h1>
<div class="epistemic">
  <strong>Epistemic status:</strong> Benchmarks are illustrative literature values, not a
  fit to any real compound. No claim that the UM KK-tower matches a laboratory material.
</div>
<p>
  <button onclick="show('/api/status')">Status</button>
  <button onclick="show('/api/benchmarks')">Benchmarks</button>
  <button onclick="show('/api/compare?n_max=3')">Compare (n_max=3)</button>
  <button onclick="show('/api/closest?n=1')">Closest to n=1</button>
</p>
<pre id="output">(results appear here)</pre>
<script>
async function show(url) {
  const res = await fetch(url);
  document.getElementById('output').textContent = JSON.stringify(await res.json(), null, 2);
}
</script>
</body>
</html>
