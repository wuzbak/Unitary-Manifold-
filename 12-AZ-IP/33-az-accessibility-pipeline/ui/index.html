<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AZ Accessibility Pipeline — Product 33</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
  .epistemic { background: #fff3cd; border: 1px solid #e0b000; padding: 0.75rem 1rem; border-radius: 6px; }
  pre { background: #0d1117; color: #c9d1d9; padding: 1rem; border-radius: 6px; overflow-x: auto; }
  textarea { width: 100%; height: 8rem; }
  button { padding: 0.4rem 0.9rem; cursor: pointer; }
</style>
</head>
<body>
<h1>AZ Accessibility Pipeline</h1>
<div class="epistemic">
  <strong>Epistemic status:</strong> Keyword-based recognition only — conservative, not full NLP.
  Fact-check verdicts are whatever Product 19's own routers already compute.
</div>
<textarea id="text">The CMB spectral index n_s prediction is a falsifiable claim about dark energy w_a tension.</textarea>
<br />
<button onclick="getReport()">Build accessibility report</button>
<pre id="output">(results appear here)</pre>
<script>
async function show(url) {
  const res = await fetch(url);
  document.getElementById('output').textContent = JSON.stringify(await res.json(), null, 2);
}
function getReport() {
  const q = new URLSearchParams({ text: document.getElementById('text').value });
  show(`/api/report?${q}`);
}
</script>
</body>
</html>
