<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AZ Braided Qubit Ansatz Studio — Product 31</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
  .epistemic { background: #fff3cd; border: 1px solid #e0b000; padding: 0.75rem 1rem; border-radius: 6px; }
  pre { background: #0d1117; color: #c9d1d9; padding: 1rem; border-radius: 6px; overflow-x: auto; max-height: 24rem; }
  fieldset { margin: 1rem 0; border-radius: 6px; }
  label { display: inline-block; min-width: 8rem; }
</style>
</head>
<body>
<h1>AZ Braided Qubit Ansatz Studio</h1>
<div class="epistemic">
  <strong>Epistemic status:</strong> No real quantum hardware is run here. This is a
  simulation-validated gate-list export only.
</div>
<fieldset>
  <legend>Build + validate a circuit</legend>
  <label>n_qubits</label><input id="nq" type="number" min="2" max="8" step="1" value="8" /><br />
  <label>n_layers</label><input id="nl" type="number" min="0" max="8" step="1" value="2" /><br />
  <label>seed</label><input id="seed" type="number" min="0" max="4294967295" step="1" value="42" /><br />
  <label>RY angles (comma-separated; overrides seed)</label><br />
  <textarea id="angles" rows="3" placeholder="Optional exact parameter vector"></textarea><br />
  <button onclick="getCircuit()">Build circuit</button>
  <button onclick="downloadQasm()">Download OpenQASM 2.0</button>
</fieldset>
<pre id="output">(results appear here)</pre>
<script>
async function show(url) {
  const res = await fetch(url);
  const payload = await res.json();
  document.getElementById('output').textContent = JSON.stringify(payload, null, 2);
  if (!res.ok) throw new Error(payload.error || `Request failed (${res.status})`);
  return payload;
}
function circuitUrl() {
  const q = new URLSearchParams({
    n_qubits: document.getElementById('nq').value,
    n_layers: document.getElementById('nl').value,
  });
  const angles = document.getElementById('angles').value.trim();
  if (angles) q.set('angles', angles);
  else q.set('seed', document.getElementById('seed').value);
  return `/api/circuit?${q}`;
}
async function getCircuit() {
  try { await show(circuitUrl()); }
  catch (error) { document.getElementById('output').textContent = error.message; }
}
async function downloadQasm() {
  try {
    const payload = await show(circuitUrl());
    const link = document.createElement('a');
    link.href = URL.createObjectURL(new Blob([payload.openqasm2], {type: 'text/plain'}));
    link.download = `braided-ansatz-${payload.n_qubits}q-${payload.n_layers}l.qasm`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  } catch (error) {
    document.getElementById('output').textContent = error.message;
  }
}
</script>
</body>
</html>
