version: "3.9"
services:
  um-sos:
    build:
      context: ../..
      dockerfile: 12-AZ-IP/04-um-sos/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - UM_SOS_HOST=0.0.0.0
      - UM_SOS_PORT=8000
    restart: unless-stopped
    volumes:
      - um-sos-data:/data

volumes:
  um-sos-data:
