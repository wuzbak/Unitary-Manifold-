[package]
name = "az-kernel"
version = "0.1.0"
edition = "2021"
authors = ["ThomasCory Walker-Pearson <theory@unitarymanifold.org>"]
description = "AxiomZero Bare-Metal Kernel — 5D Kaluza-Klein Operating System"
license = "LicenseRef-DefensivePublicCommons-1.0"
repository = "https://github.com/wuzbak/Unitary-Manifold-"

# SPRINT 0: Bare-metal build configuration
[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"

[dependencies]
# UEFI boot services (Sprint 0).
#
# NOTE: the `global_allocator` feature is deliberately NOT enabled. That
# feature installs a `#[global_allocator]` backed by UEFI's AllocatePool/
# FreePool boot services, which become invalid the instant
# `boot::exit_boot_services` runs. The kernel supplies its own
# `mm::heap::LockedHeap`, backed by memory it owns for its entire lifetime
# (see src/mm/heap.rs and the `#[global_allocator]` in src/main.rs), so
# allocation never depends on firmware boot services after the handoff.
uefi = { version = "0.33", features = ["alloc", "logger"] }

# Embedded utilities for no_std kernel (Sprint 1)
bitflags = "2"
spin = "0.9"          # spinlock primitives (no OS mutexes available)
log = "0.4"

# Physics-informed data structures (Sprint 1)
heapless = "0.8"       # fixed-capacity collections (no heap until AZ-MM boots)
libm = "0.2"           # software math (sqrtf) for no_std geodesic scheduler

[lib]
name = "az_kernel"
path = "src/lib.rs"

[[bin]]
name = "az-kernel"
path = "src/main.rs"
