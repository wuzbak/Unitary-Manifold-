<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AZ Materials Screening Engine — Product 30</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
  .epistemic { background: #fff3cd; border: 1px solid #e0b000; padding: 0.75rem 1rem; border-radius: 6px; }
  pre { background: #0d1117; color: #c9d1d9; padding: 1rem; border-radius: 6px; overflow-x: auto; }
  fieldset { margin: 1rem 0; border-radius: 6px; }
  label { display: inline-block; min-width: 8rem; }
</style>
</head>
<body>
<h1>AZ Materials Screening Engine</h1>
<div class="epistemic">
  <strong>Epistemic status:</strong> A ranking tool over already-published formulas. It validates
  nothing on its own and makes no claim that any candidate material shows UM-distinctive behavior.
</div>

<fieldset>
  <legend>Screen one candidate</legend>
  <label>name</label><input id="name" value="demo" /><br />
  <label>alpha</label><input id="alpha" type="number" step="0.01" value="0.5" /><br />
  <label>omega_lo_mev</label><input id="omega" type="number" step="0.1" value="100" /><br />
  <label>m_band_me</label><input id="mband" type="number" step="0.01" value="0.2" /><br />
  <label>epsilon_r</label><input id="eps" type="number" step="0.1" value="3.0" /><br />
  <button onclick="screenOne()">Screen</button>
</fieldset>
<fieldset>
  <legend>Demo ranking (graphene / MoS2 / hBN)</legend>
  <button onclick="demoRank()">Rank demo candidates</button>
</fieldset>
<pre id="output">(results appear here)</pre>
<script>
async function show(url) {
  const res = await fetch(url);
  document.getElementById('output').textContent = JSON.stringify(await res.json(), null, 2);
}
function screenOne() {
  const q = new URLSearchParams({
    name: document.getElementById('name').value,
    alpha: document.getElementById('alpha').value,
    omega_lo_mev: document.getElementById('omega').value,
    m_band_me: document.getElementById('mband').value,
    epsilon_r: document.getElementById('eps').value,
  });
  show(`/api/screen?${q}`);
}
function demoRank() { show('/api/demo-rank'); }
</script>
</body>
</html>
