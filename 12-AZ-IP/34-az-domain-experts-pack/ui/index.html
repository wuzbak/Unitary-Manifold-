<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AZ Domain Experts Pack — Product 34</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
  .epistemic { background: #fff3cd; border: 1px solid #e0b000; padding: 0.75rem 1rem; border-radius: 6px; }
  pre { background: #0d1117; color: #c9d1d9; padding: 1rem; border-radius: 6px; overflow-x: auto; }
  fieldset { margin: 1rem 0; border-radius: 6px; }
  label { display: inline-block; min-width: 8rem; }
  input, select { width: 20rem; }
</style>
</head>
<body>
<h1>AZ Domain Experts Pack</h1>
<div class="epistemic">
  <strong>Epistemic status:</strong> Simple keyword-overlap retrieval over docstrings, not a
  trained language model.
</div>
<fieldset>
  <legend>Query a domain expert</legend>
  <label>expert</label>
  <select id="expert">
    <option value="materials-science">materials-science</option>
    <option value="atomic-spectroscopy">atomic-spectroscopy</option>
  </select><br />
  <label>question</label><input id="question" value="polaron effective mass" /><br />
  <label>top_k</label><input id="topk" type="number" value="3" /><br />
  <button onclick="runQuery()">Query</button>
</fieldset>
<pre id="output">(results appear here)</pre>
<script>
async function show(url) {
  const res = await fetch(url);
  document.getElementById('output').textContent = JSON.stringify(await res.json(), null, 2);
}
function runQuery() {
  const q = new URLSearchParams({
    expert: document.getElementById('expert').value,
    question: document.getElementById('question').value,
    top_k: document.getElementById('topk').value,
  });
  show(`/api/query?${q}`);
}
</script>
</body>
</html>
