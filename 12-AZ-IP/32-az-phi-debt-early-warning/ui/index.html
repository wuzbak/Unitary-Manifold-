<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AZ Phi-Debt Early Warning Library — Product 32</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
  .epistemic { background: #fff3cd; border: 1px solid #e0b000; padding: 0.75rem 1rem; border-radius: 6px; }
  pre { background: #0d1117; color: #c9d1d9; padding: 1rem; border-radius: 6px; overflow-x: auto; }
  fieldset { margin: 1rem 0; border-radius: 6px; }
  label { display: inline-block; min-width: 10rem; }
  input { width: 14rem; }
</style>
</head>
<body>
<h1>AZ Phi-Debt Early Warning Library</h1>
<div class="epistemic">
  <strong>Epistemic status:</strong> A general dynamical-systems accounting tool, not a physics claim.
</div>
<fieldset>
  <legend>Run a monitor</legend>
  <label>capacity</label><input id="capacity" type="number" step="0.01" value="1.0" /><br />
  <label>discharge_rate</label><input id="discharge" type="number" step="0.01" value="0.1" /><br />
  <label>warning_fraction</label><input id="warn" type="number" step="0.01" value="0.8" /><br />
  <label>steps (amount:dt, comma-separated)</label><input id="steps" value="0.9:1,0.85:1,0.7:1,0.6:1" /><br />
  <button onclick="runMonitor()">Run</button>
</fieldset>
<pre id="output">(results appear here)</pre>
<script>
async function show(url) {
  const res = await fetch(url);
  document.getElementById('output').textContent = JSON.stringify(await res.json(), null, 2);
}
function runMonitor() {
  const q = new URLSearchParams({
    capacity: document.getElementById('capacity').value,
    discharge_rate: document.getElementById('discharge').value,
    warning_fraction: document.getElementById('warn').value,
    steps: document.getElementById('steps').value,
  });
  show(`/api/monitor?${q}`);
}
</script>
</body>
</html>
