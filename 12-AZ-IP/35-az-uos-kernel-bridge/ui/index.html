<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AZ UOS/AZ-KERNEL Bridge — Product 35</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
  .epistemic { background: #fff3cd; border: 1px solid #e0b000; padding: 0.75rem 1rem; border-radius: 6px; }
  pre { background: #0d1117; color: #c9d1d9; padding: 1rem; border-radius: 6px; overflow-x: auto; }
  fieldset { margin: 1rem 0; border-radius: 6px; }
  button { padding: 0.4rem 0.9rem; cursor: pointer; margin-right: 0.5rem; }
</style>
</head>
<body>
<h1>AZ UOS/AZ-KERNEL Bridge</h1>
<div class="epistemic">
  <strong>Epistemic status:</strong> Design-only interface contract plus a cross-checked
  addressing rule. No Rust code is generated or ported here.
</div>
<fieldset>
  <legend>Actions</legend>
  <button onclick="show('/api/validate-adjacency')">Validate adjacency vs kk_channel.rs</button>
  <button onclick="getNeighbors()">Get neighbors</button>
  <input id="ring" type="number" value="0" style="width:4rem" />
  <button onclick="show('/api/contract')">Get Rust interface contract</button>
</fieldset>
<fieldset>
  <legend>Validate an AZ-KERNEL KKMessage</legend>
  <label>From <input id="from-ring" type="number" value="0" min="0" max="4" /></label>
  <label>To <input id="to-ring" type="number" value="1" min="0" max="4" /></label>
  <label>Payload (u64; dashboard safe-integer range) <input id="payload" type="number" value="123" min="0" max="9007199254740991" step="1" /></label>
  <label>Sequence (u32) <input id="seq" type="number" value="0" min="0" max="4294967295" step="1" /></label>
  <button onclick="sendMessage()">Build JSON adapter record</button>
</fieldset>
<pre id="output">(results appear here)</pre>
<script>
async function show(url) {
  const res = await fetch(url);
  document.getElementById('output').textContent = JSON.stringify(await res.json(), null, 2);
}
function getNeighbors() { show(`/api/neighbors?ring=${document.getElementById('ring').value}`); }
async function sendMessage() {
  const numericFields = ['from-ring', 'to-ring', 'payload', 'seq'];
  const values = numericFields.map(id => Number(document.getElementById(id).value));
  if (values.some(value => !Number.isSafeInteger(value))) {
    document.getElementById('output').textContent =
      'Enter safe integer values; the API itself accepts the full u64 payload range.';
    return;
  }
  const message = {
    from_ring: values[0],
    to_ring: values[1],
    payload: values[2],
    seq: values[3]
  };
  const res = await fetch('/api/ipc-message', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(message)
  });
  document.getElementById('output').textContent =
    JSON.stringify(await res.json(), null, 2);
}
</script>
</body>
</html>
