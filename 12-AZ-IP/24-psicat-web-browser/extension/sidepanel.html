<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PsiCat Companion</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <main>
    <h1>PsiCat</h1>
    <p class="sub">Page-aware notebook and interrogation companion.</p>
    <button id="capture-page">Capture active page</button>
    <textarea id="question" placeholder="Ask about the active page, remembered pages, or imported notes"></textarea>
    <button id="ask-psicat">Summarize / interrogate</button>
    <pre id="answer">No query yet.</pre>
    <section>
      <h2>Notebook</h2>
      <input id="note-title" placeholder="Note title">
      <textarea id="note-text" placeholder="Type a note or use capture/import"></textarea>
      <div class="row">
        <button id="save-note">Save note</button>
        <button id="import-notes">Import</button>
        <button id="export-notes">Export</button>
      </div>
      <input id="import-file" type="file" accept=".json,.txt,.md,.html" hidden>
      <div id="notebook-list"></div>
    </section>
  </main>
  <script src="sidepanel.js"></script>
</body>
</html>
