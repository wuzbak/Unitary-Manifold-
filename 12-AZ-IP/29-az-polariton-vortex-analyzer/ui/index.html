<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AZ Polariton Vortex Analyzer — Product 29</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
  .epistemic { background: #fff3cd; border: 1px solid #e0b000; padding: 0.75rem 1rem; border-radius: 6px; }
  pre { background: #0d1117; color: #c9d1d9; padding: 1rem; border-radius: 6px; overflow-x: auto; }
  fieldset { margin: 1rem 0; border-radius: 6px; }
  label { display: inline-block; min-width: 8rem; }
</style>
</head>
<body>
<h1>AZ Polariton Vortex Analyzer</h1>
<div class="epistemic">
  <strong>Epistemic status:</strong> Analysis software only. No real pump-probe dataset is bundled
  here — the demo endpoint below is a synthetic self-consistency check, not evidence of anything.
</div>

<fieldset>
  <legend>Prediction curve</legend>
  <label for="cs">c_s</label><input id="cs" type="number" step="0.001" value="0.3243" /><br />
  <button onclick="getPrediction()">Get predicted critical angle</button>
</fieldset>
<fieldset>
  <legend>Synthetic demo comparison</legend>
  <button onclick="getDemo()">Run demo comparison</button>
</fieldset>
<pre id="output">(results appear here)</pre>
<script>
async function show(url) {
  const res = await fetch(url);
  document.getElementById('output').textContent = JSON.stringify(await res.json(), null, 2);
}
function getPrediction() { show(`/api/prediction?c_s=${document.getElementById('cs').value}`); }
function getDemo() { show(`/api/demo-comparison?c_s=${document.getElementById('cs').value}`); }
</script>
</body>
</html>
