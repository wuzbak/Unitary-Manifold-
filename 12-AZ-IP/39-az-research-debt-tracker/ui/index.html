<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AZ Research-Debt Tracker — Product 39</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
  .epistemic { background: #fff3cd; border: 1px solid #e0b000; padding: 0.75rem 1rem; border-radius: 6px; }
  pre { background: #0d1117; color: #c9d1d9; padding: 1rem; border-radius: 6px; overflow-x: auto; }
  button { margin-right: 0.5rem; }
</style>
</head>
<body>
<h1>AZ Research-Debt Tracker</h1>
<div class="epistemic">
  <strong>Epistemic status:</strong> Read-only dashboard over the project's own real,
  live MAS Wave Engine gap list. Defining a new tracker remains a Python-level task.
</div>
<p>
  <button onclick="show('/api/status')">Status</button>
  <button onclick="show('/api/health-score')">Health score</button>
  <button onclick="show('/api/open-items')">Open items</button>
  <button onclick="show('/api/closed-items')">Closed items</button>
</p>
<pre id="output">(results appear here)</pre>
<script>
async function show(url) {
  const res = await fetch(url);
  document.getElementById('output').textContent = JSON.stringify(await res.json(), null, 2);
}
</script>
</body>
</html>
