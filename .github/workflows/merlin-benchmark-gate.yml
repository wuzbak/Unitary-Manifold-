name: merlin-benchmark-gate

on:
  pull_request:
    paths:
      - "12-AZ-IP/20-merlin-navigator/**"
      - ".github/workflows/merlin-benchmark-gate.yml"
  push:
    branches:
      - main
    paths:
      - "12-AZ-IP/20-merlin-navigator/**"
      - ".github/workflows/merlin-benchmark-gate.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  merlin-stage-a-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: 12-AZ-IP/20-merlin-navigator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Product tests
        run: python -m pytest tests/ -q

      - name: Stage A benchmark promotion gate
        run: python tools/run_merlin_stage_a_benchmarks.py --json

      - name: Stage B benchmark receipts
        run: python tools/run_merlin_stage_bc_benchmarks.py --stage stage_b --limit 3 --json --output /tmp/merlin-stage-b-receipts.json

      - name: Stage C benchmark receipts
        run: python tools/run_merlin_stage_bc_benchmarks.py --stage stage_c --limit 3 --json --output /tmp/merlin-stage-c-receipts.json

      - name: Stage D benchmark receipts
        run: python tools/run_merlin_stage_bc_benchmarks.py --stage stage_d --limit 2 --json --output /tmp/merlin-stage-d-receipts.json

      - name: Stage E benchmark receipts
        run: python tools/run_merlin_stage_bc_benchmarks.py --stage stage_e --limit 2 --json --output /tmp/merlin-stage-e-receipts.json

      - name: Export Stage A artifact bundle
        run: python tools/export_merlin_stage_a_artifacts.py --limit 3 --output /tmp/merlin-stage-a-artifacts.json

      - name: Export Merlin training artifact bundle
        run: python tools/export_merlin_training_artifacts.py --limit 12 --output /tmp/merlin-training-artifacts.json

      - name: Export Merlin training JSONL pack
        run: python tools/export_merlin_training_jsonl.py --limit 12 --output-dir /tmp/merlin-training-jsonl

      - name: Export Merlin MLflow manifests
        run: python tools/export_merlin_mlflow_manifests.py --limit 12 --output-dir /tmp/merlin-mlflow

      - name: Upload Stage A artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: merlin-stage-a-artifacts
          path: /tmp/merlin-stage-a-artifacts.json

      - name: Upload Stage B receipts
        uses: actions/upload-artifact@v4
        with:
          name: merlin-stage-b-receipts
          path: /tmp/merlin-stage-b-receipts.json

      - name: Upload Stage C receipts
        uses: actions/upload-artifact@v4
        with:
          name: merlin-stage-c-receipts
          path: /tmp/merlin-stage-c-receipts.json

      - name: Upload Stage D receipts
        uses: actions/upload-artifact@v4
        with:
          name: merlin-stage-d-receipts
          path: /tmp/merlin-stage-d-receipts.json

      - name: Upload Stage E receipts
        uses: actions/upload-artifact@v4
        with:
          name: merlin-stage-e-receipts
          path: /tmp/merlin-stage-e-receipts.json

      - name: Upload Merlin training artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: merlin-training-artifacts
          path: /tmp/merlin-training-artifacts.json

      - name: Upload Merlin training JSONL pack
        uses: actions/upload-artifact@v4
        with:
          name: merlin-training-jsonl
          path: /tmp/merlin-training-jsonl

      - name: Upload Merlin MLflow manifests
        uses: actions/upload-artifact@v4
        with:
          name: merlin-mlflow-manifests
          path: /tmp/merlin-mlflow
