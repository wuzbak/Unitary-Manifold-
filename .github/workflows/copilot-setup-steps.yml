name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - requirements-dev.txt
      - requirements.txt
      - 12-AZ-IP/20-psicat-navigator/requirements.txt
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - requirements-dev.txt
      - requirements.txt
      - 12-AZ-IP/20-psicat-navigator/requirements.txt

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 59
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install deterministic verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r 12-AZ-IP/20-psicat-navigator/requirements.txt
