name: AxiomZero Android Suite Test Release

on:
  pull_request:
    paths:
      - ".github/workflows/android-suite-release.yml"
      - ".github/workflows/android-suite-build.yml"
      - ".github/scripts/verify-android-suite.sh"
      - "12-AZ-IP/46-axiomzero-android-suite/**"
      - "12-AZ-IP/45-axiomzero-pc-suite/catalog/**"
      - "12-AZ-IP/45-axiomzero-pc-suite/scripts/build_catalog.py"
  push:
    tags:
      - "android-suite-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/android-suite-build.yml

  publish:
    name: Publish Product 46 test pre-release
    if: startsWith(github.ref, 'refs/tags/android-suite-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify release tag matches Product 46 version
        run: |
          version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"[[:space:]]*$/\1/p' 12-AZ-IP/46-axiomzero-android-suite/app/build.gradle.kts)"
          if [[ -z "$version" || "$GITHUB_REF_NAME" != "android-suite-v$version" ]]; then
            echo "::error::Release tag must match Product 46 versionName."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: axiomzero-android-suite-debug
          path: release-assets
      - name: Verify and checksum the APK
        working-directory: release-assets
        run: |
          test -s app-debug.apk
          sha256sum app-debug.apk > SHA256SUMS.txt
      - name: Publish the pre-release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/app-debug.apk \
            release-assets/SHA256SUMS.txt \
            --title "$GITHUB_REF_NAME — AxiomZero Android Suite (debug test build)" \
            --notes "Product 46 debug APK for testing only. It uses this workflow runner's non-production debug signing key and is not production/release-signed or Play Store-ready. A future test APK may not update this install; uninstalling clears private app data, so export notes first. Verify app-debug.apk with SHA256SUMS.txt. Physical-device qualification is not claimed." \
            --prerelease \
            --verify-tag
