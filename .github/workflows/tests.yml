name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Fast test suite (tests/ — excludes @pytest.mark.slow)
  # ──────────────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-xdist
      - name: Run pytest (fast suite — tests/ excluding @pytest.mark.slow, xdist)
        run: python -m pytest tests/ -m "not slow" -n auto --dist loadscope -v

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Slow test suite (tests/ -m slow — Richardson extrapolation etc.)
  # ──────────────────────────────────────────────────────────────────────────
  test-slow:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-xdist
      - name: Run pytest (slow suite — tests/ -m slow)
        run: python -m pytest tests/ -m slow -v

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Claims verification (claims/ — integer derivation, birefringence, etc.)
  # ──────────────────────────────────────────────────────────────────────────
  test-claims:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-xdist
      - name: Run pytest (claims/)
        run: python -m pytest claims/ -v

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: Recycling suite (recycling/ — Pillar 16 φ-debt entropy accounting)
  # ──────────────────────────────────────────────────────────────────────────
  test-recycling:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-xdist
      - name: Run pytest (recycling/)
        run: python -m pytest recycling/ -v

  # ──────────────────────────────────────────────────────────────────────────
  # Job 5: Unitary Pentad suite (Unitary Pentad/ — HILS governance framework)
  # ──────────────────────────────────────────────────────────────────────────
  test-pentad:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-xdist
      - name: Run pytest (Unitary Pentad/)
        run: python -m pytest "5-GOVERNANCE/Unitary Pentad/" -v

  # ──────────────────────────────────────────────────────────────────────────
  # Job 6: ALGEBRA_PROOF.py — 114-check formal falsification proof
  # ──────────────────────────────────────────────────────────────────────────
  algebra-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-xdist sympy
      - name: Run ALGEBRA_PROOF.py (114 formal checks)
        run: python3 ALGEBRA_PROOF.py

  # ──────────────────────────────────────────────────────────────────────────
  # Job 7: Canonical ledger + onboarding docs consistency gate
  # Ensures no doc drifts away from the canonical test count in STATUS.md.
  # ──────────────────────────────────────────────────────────────────────────
  ledger-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy scipy pytest pytest-xdist
      - name: Run canonical ledger + onboarding consistency checks
        run: python -m pytest tests/test_canonical_ledger_consistency.py -v
      - name: Run status-sync and registry-integrity sweeps
        run: |
          python -m pytest \
            tests/test_pillar1078_parallel_audit_remediation.py::test_public_status_sync_check \
            tests/test_pillar536_axiomzero_ip_registry.py::TestVerifyAgainstRegistry::test_verify_no_tampered \
            -v
      - name: Guard large directory entry counts
        run: python TOOLS/checks/check_large_directories.py
      - name: Enforce tracked-file size limit
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          python TOOLS/checks/check_large_files.py \
            --max-bytes 5242880 \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"

  full-regression-gate:
    name: Full regression gate (all shards)
    if: always()
    runs-on: ubuntu-latest
    needs:
      - test
      - test-slow
      - test-claims
      - test-recycling
      - test-pentad
      - algebra-proof
      - ledger-consistency
    permissions:
      contents: read
    steps:
      - name: Evaluate shard outcomes
        env:
          TEST_RESULT: ${{ needs.test.result }}
          TEST_SLOW_RESULT: ${{ needs.test-slow.result }}
          CLAIMS_RESULT: ${{ needs.test-claims.result }}
          RECYCLING_RESULT: ${{ needs.test-recycling.result }}
          PENTAD_RESULT: ${{ needs.test-pentad.result }}
          ALGEBRA_RESULT: ${{ needs.algebra-proof.result }}
          LEDGER_RESULT: ${{ needs.ledger-consistency.result }}
        run: |
          set -euo pipefail
          failures=0

          check_result () {
            local label="$1"
            local result="$2"
            echo "${label}: ${result}"
            if [ "${result}" != "success" ]; then
              failures=$((failures + 1))
            fi
          }

          check_result "tests-fast" "${TEST_RESULT}"
          check_result "tests-slow" "${TEST_SLOW_RESULT}"
          check_result "claims" "${CLAIMS_RESULT}"
          check_result "recycling" "${RECYCLING_RESULT}"
          check_result "pentad" "${PENTAD_RESULT}"
          check_result "algebra-proof" "${ALGEBRA_RESULT}"
          check_result "ledger-consistency" "${LEDGER_RESULT}"

          {
            echo "## Full regression shard results"
            echo "- tests-fast: ${TEST_RESULT}"
            echo "- tests-slow: ${TEST_SLOW_RESULT}"
            echo "- claims: ${CLAIMS_RESULT}"
            echo "- recycling: ${RECYCLING_RESULT}"
            echo "- pentad: ${PENTAD_RESULT}"
            echo "- algebra-proof: ${ALGEBRA_RESULT}"
            echo "- ledger-consistency: ${LEDGER_RESULT}"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${failures}" -ne 0 ]; then
            echo "One or more required shards failed."
            exit 1
          fi
