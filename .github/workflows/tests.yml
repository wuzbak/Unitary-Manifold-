name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Compactified preflight for early proof/frontier signal
  # ──────────────────────────────────────────────────────────────────────────
  test-compactified-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-xdist
      - name: Run compactified preflight
        run: python TOOLS/checks/run_supervised_pytest_batch.py --suite compactified-preflight

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Fast test suite (tests/ — excludes @pytest.mark.slow) in shards
  # ──────────────────────────────────────────────────────────────────────────
  test-fast-batched:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        batch-index: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-xdist
      - name: Run pytest (fast suite shard ${{ matrix.batch-index }})
        run: python TOOLS/checks/run_supervised_pytest_batch.py --suite tests-fast --batch-count 4 --batch-index ${{ matrix.batch-index }}

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Supervisor gate for batched fast-suite coverage
  # ──────────────────────────────────────────────────────────────────────────
  test-fast-supervisor:
    runs-on: ubuntu-latest
    needs: test-fast-batched
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify batched fast-suite coverage
        run: python TOOLS/checks/run_supervised_pytest_batch.py --suite supervisor-check --batch-count 4 --emit-json

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: Slow test suite (tests/ -m slow — Richardson extrapolation etc.)
  # ──────────────────────────────────────────────────────────────────────────
  test-slow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-xdist
      - name: Run pytest (slow suite — tests/ -m slow)
        run: python -m pytest tests/ -m slow -q

  # ──────────────────────────────────────────────────────────────────────────
  # Job 5: Claims verification (claims/ — integer derivation, birefringence, etc.)
  # ──────────────────────────────────────────────────────────────────────────
  test-claims:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-xdist
      - name: Run pytest (claims/)
        run: python -m pytest claims/ -q

  # ──────────────────────────────────────────────────────────────────────────
  # Job 6: Recycling suite (recycling/ — Pillar 16 φ-debt entropy accounting)
  # ──────────────────────────────────────────────────────────────────────────
  test-recycling:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-xdist
      - name: Run pytest (recycling/)
        run: python -m pytest recycling/ -q

  # ──────────────────────────────────────────────────────────────────────────
  # Job 7: Unitary Pentad suite (Unitary Pentad/ — HILS governance framework)
  # ──────────────────────────────────────────────────────────────────────────
  test-pentad:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-xdist
      - name: Run pytest (Unitary Pentad/)
        run: python -m pytest "5-GOVERNANCE/Unitary Pentad/" -q

  # ──────────────────────────────────────────────────────────────────────────
  # Job 8: ALGEBRA_PROOF.py — 114-check formal falsification proof
  # ──────────────────────────────────────────────────────────────────────────
  algebra-proof:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-xdist sympy
      - name: Run ALGEBRA_PROOF.py (114 formal checks)
        run: python3 ALGEBRA_PROOF.py

  # ──────────────────────────────────────────────────────────────────────────
  # Job 9: Canonical ledger + onboarding docs consistency gate
  # Ensures no doc drifts away from the canonical test count in STATUS.md.
  # ──────────────────────────────────────────────────────────────────────────
  ledger-consistency:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy scipy pytest pytest-xdist
      - name: Run canonical ledger + onboarding consistency checks
        run: python -m pytest tests/test_canonical_ledger_consistency.py -v
      - name: Run status-sync and registry-integrity sweeps
        run: |
          python -m pytest \
            tests/test_pillar1078_parallel_audit_remediation.py::test_public_status_sync_check \
            tests/test_pillar536_axiomzero_ip_registry.py::TestVerifyAgainstRegistry::test_verify_no_tampered \
            -v
      - name: Guard large directory entry counts
        run: python TOOLS/checks/check_large_directories.py
      - name: Enforce tracked-file size limit
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          python TOOLS/checks/check_large_files.py \
            --max-bytes 5242880 \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"
