name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  platform-smoke:
    name: Platform smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run smoke tests (high-signal, budget-safe)
        run: |
          python3 -m pytest \
            tests/test_metric.py \
            tests/test_check_large_files.py \
            -q --tb=short

  ci-gate:
    name: CI gate
    if: always()
    runs-on: ubuntu-latest
    needs:
      - platform-smoke
    permissions:
      contents: read
    steps:
      - name: Evaluate CI smoke outcome
        env:
          PLATFORM_SMOKE_RESULT: ${{ needs.platform-smoke.result }}
        run: |
          set -euo pipefail
          echo "platform-smoke: ${PLATFORM_SMOKE_RESULT}"
          {
            echo "## CI smoke result"
            echo "- platform-smoke: ${PLATFORM_SMOKE_RESULT}"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${PLATFORM_SMOKE_RESULT}" != "success" ]; then
            exit 1
          fi
