name: Create GitHub Release

# Triggers whenever a tag matching v* is pushed (e.g. v9.0, v9.1).
# A GitHub Release is required for Zenodo to automatically archive the repo
# and mint a DOI.  Make sure you have enabled this repo in your Zenodo
# GitHub integration first: https://zenodo.org/account/settings/github/
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v9.0-snapshot-2026-04-12)'
        required: true
        default: 'v9.0-snapshot-2026-04-12'

permissions:
  contents: write       # needed to create the release
  id-token: write       # needed for SLSA provenance attestation
  attestations: write   # needed for actions/attest-build-provenance

jobs:
  release:
    name: Build release archive and publish
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}

    steps:
      # ── 1. Checkout full history so the archive is complete ──────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── 2. Run full regression and capture signed result ─────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy sympy mpmath pytest
          pip install -r requirements.txt

      - name: Run full regression (produces provenance artifact)
        run: |
          mkdir -p artifacts
          python -m pytest tests/ recycling/ "5-GOVERNANCE/Unitary Pentad/" \
            -q --tb=short 2>&1 | tee artifacts/regression-output.txt
          python3 - <<'PY'
          import hashlib, json, datetime
          from pathlib import Path
          raw = Path("artifacts/regression-output.txt").read_bytes()
          sha = hashlib.sha256(raw).hexdigest()
          summary = {
              "timestamp_utc": datetime.datetime.utcnow().isoformat(),
              "sha256_regression_output": sha,
              "tag": "${{ env.RELEASE_TAG }}",
              "runner": "ubuntu-latest / python-3.12",
          }
          Path("artifacts/regression-provenance.json").write_text(
              json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          PY

      # ── 3. Generate SBOM (Software Bill of Materials) ────────────────────
      - name: Generate SBOM
        run: |
          pip install pip-licenses
          pip-licenses --format=json --output-file=artifacts/sbom.json
          pip-licenses --format=plain-vertical --output-file=artifacts/sbom.txt
          echo "SBOM generated: $(wc -l < artifacts/sbom.txt) packages"

      # ── 4. Build the source archive ──────────────────────────────────────
      - name: Build source archive
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          git archive \
            --format=zip \
            --prefix="unitary-manifold-${TAG}/" \
            HEAD \
            -o "unitary-manifold-${TAG}.zip"
          echo "ARCHIVE=unitary-manifold-${TAG}.zip" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      # ── 5. SLSA provenance attestation ───────────────────────────────────
      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ env.ARCHIVE }}
            artifacts/regression-provenance.json
            artifacts/sbom.json

      # ── 6. Upload provenance artifacts ───────────────────────────────────
      - name: Upload provenance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-provenance-${{ env.TAG }}
          path: artifacts/
          if-no-files-found: error

      # ── 7. Create the GitHub Release ─────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "The Unitary Manifold ${{ env.TAG }}"
          tag_name: ${{ env.TAG }}
          body: |
            ## The Unitary Manifold — ${{ env.TAG }}

            **A 5D Gauge Geometry of Emergent Irreversibility**
            Author: ThomasCory Walker-Pearson

            This release packages the full academic edition for archiving and citation:

            | Resource | Link |
            |---|---|
            | Monograph PDF | `THEBOOKV9a (1).pdf` in the source archive |
            | LaTeX source  | `arxiv/main.tex` + `arxiv/references.bib` |
            | Numerical code | `src/` (Python, requires `numpy`/`scipy`) |
            | arXiv guide | `arxiv/SUBMISSION_GUIDE.md` |
            | Zenodo guide | `zenodo/SUBMISSION_GUIDE.md` |
            | Citation | `CITATION.cff` |

            ### Provenance & Reproducibility
            Every release includes machine-signed SLSA provenance (via
            `actions/attest-build-provenance`), a full regression log with
            SHA-256 fingerprint, and a complete SBOM listing all transitive
            dependencies and their licenses.  Verify with:
            ```bash
            gh attestation verify unitary-manifold-${{ env.TAG }}.zip \
              --repo wuzbak/Unitary-Manifold-
            ```

            ### Zenodo DOI
            If you have enabled this repository at
            https://zenodo.org/account/settings/github/
            Zenodo will automatically archive this release and mint a DOI
            within a few minutes.

            ### License
            Dedicated to the **Defensive Public Commons** — free for all
            humanity, forever.
          draft: false
          prerelease: false
          files: |
            ${{ env.ARCHIVE }}
            artifacts/regression-provenance.json
            artifacts/sbom.json
