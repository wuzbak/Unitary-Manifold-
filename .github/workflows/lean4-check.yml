name: Lean 4 Formal Proofs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:
  lean4-build:
    name: Lake build (Lean 4 + Mathlib)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        working-directory: lean4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: |
            lean4/.lake/packages
            ~/.elan
          key: lean4-${{ hashFiles('lean4/lean-toolchain', 'lean4/lakefile.lean') }}
          restore-keys: lean4-

      - name: Lake update
        run: lake update

      - name: Download Mathlib cache
        run: lake exe cache get || true

      - name: Lake build
        working-directory: .
        run: python3 -m TOOLS.um_arts capture --repo "$GITHUB_WORKSPACE" --output "$GITHUB_WORKSPACE/.um-arts/lean-full" --timeout 3600 -- lake -d lean4 build

      - name: Verify NumericalChecks compile
        working-directory: .
        run: python3 -m TOOLS.um_arts capture --repo "$GITHUB_WORKSPACE" --output "$GITHUB_WORKSPACE/.um-arts/lean-numerical" --timeout 900 -- lake -d lean4 build UnitaryManifold.NumericalChecks

      - name: Build checked UM-ARTS declaration exporter
        run: lake build um_arts_export

      - name: Install existing pytest dependency for exporter checks
        working-directory: .
        run: python3 -m pip install 'pytest>=7.0,<9.1'

      - name: Verify exporter with the pinned Lean toolchain
        working-directory: .
        run: |
          python3 -m TOOLS.um_arts capture --repo "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/.um-arts/lean-exporter-tests" --timeout 300 \
            -- python3 -m pytest tests/test_um_arts_lean_exporter.py \
            --noconftest -m "" -q

      - name: Preserve Lean build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: um-arts-lean
          path: .um-arts/
          include-hidden-files: true
          if-no-files-found: warn
