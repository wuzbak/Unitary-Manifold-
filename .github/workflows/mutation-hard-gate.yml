name: Mutation Hard Gate

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  mutation-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MUTATION_KILL_RATE_MIN: "0.80"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt "mutmut<3"

      - name: Run mutation testing (focused inflation invariants)
        continue-on-error: true
        run: |
          mutmut run \
            --paths-to-mutate src/core/inflation.py \
            --runner "python -m pytest tests/test_inflation.py tests/test_braided_winding.py -x -q" \
            2>&1 | tee /tmp/mutmut_run.log

      - name: Check surviving mutants
        run: |
          python3 - <<'PY'
          import subprocess, sys, re, os

          # ── Parse emoji-summary lines from the captured run log ─────────────
          # mutmut prints live progress lines like:
          #   ⠋ 1454/1454  🎉 752  ⏰ 0  🤔 0  🙁 702  🔇 0
          # We read the LAST such line to get final tallies.
          killed = survived = timeout = suspicious = 0
          try:
              with open("/tmp/mutmut_run.log") as f:
                  run_log = f.read()
          except FileNotFoundError:
              run_log = ""

          print("=== mutmut run output (last 500 chars) ===")
          print(run_log[-500:])
          print("===========================================")

          # Walk lines in reverse so we hit the last/final summary first.
          for line in reversed(run_log.splitlines()):
              m_k = re.search(r"\U0001f389\s+(\d+)", line)   # 🎉 killed
              m_s = re.search(r"\U0001f641\s+(\d+)", line)   # 🙁 survived
              m_t = re.search(r"\u23f0\s+(\d+)", line)       # ⏰ timeout
              m_q = re.search(r"\U0001f914\s+(\d+)", line)   # 🤔 suspicious
              if m_k or m_s:
                  killed     = int(m_k.group(1)) if m_k else 0
                  survived   = int(m_s.group(1)) if m_s else 0
                  timeout    = int(m_t.group(1)) if m_t else 0
                  suspicious = int(m_q.group(1)) if m_q else 0
                  break

          # Fallback: run `mutmut results` and count surviving mutant IDs
          # (each surviving mutant is listed on its own line as an integer).
          if killed == 0 and survived == 0:
              print("Emoji parse found nothing; falling back to mutmut results")
              res = subprocess.run(["mutmut", "results"],
                                   capture_output=True, text=True)
              results_out = res.stdout + res.stderr
              print(results_out[:2000])
              survived_ids = [ln.strip() for ln in results_out.splitlines()
                              if ln.strip().isdigit()]
              survived = len(survived_ids)
              # killed unknown → treat total as survived only (conservative)
              total = survived
          else:
              total = killed + survived + timeout + suspicious

          if total == 0:
              print("No mutants generated; treating as PASS.")
              sys.exit(0)

          kill_rate = killed / total
          print(
              f"Kill rate: {kill_rate:.2%}  "
              f"({killed} killed / {total} total; "
              f"{survived} survived, {timeout} timeout, {suspicious} suspicious)"
          )

          minimum = float(os.environ.get("MUTATION_KILL_RATE_MIN", "0.80"))
          if kill_rate < minimum:
              print(f"FAIL: kill rate {kill_rate:.2%} < {minimum:.0%}")
              sys.exit(1)
          else:
              print(f"PASS: kill rate {kill_rate:.2%} >= {minimum:.0%}")
          PY
