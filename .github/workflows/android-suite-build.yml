name: AxiomZero Android Build and Device Verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Product 46 on an Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Provision the Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install the pinned Android native toolchain
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Verify the canonical offline catalog
        run: |
          python3 12-AZ-IP/45-axiomzero-pc-suite/scripts/build_catalog.py --check
          python3 12-AZ-IP/46-axiomzero-android-suite/scripts/build_catalog.py --check
      - name: Build, test, and lint Product 46
        working-directory: 12-AZ-IP/46-axiomzero-android-suite
        run: |
          checksum="$(curl --fail --location --proto '=https' --proto-redir '=https' --silent --show-error --max-time 60 https://services.gradle.org/distributions/gradle-8.6-bin.zip.sha256)"
          if [[ ! "$checksum" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Official Gradle distribution checksum must be exactly 64 lowercase hexadecimal characters."
            exit 1
          fi
          printf '\ndistributionSha256Sum=%s\n' "$checksum" >> gradle/wrapper/gradle-wrapper.properties
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest
      - name: Enable emulator hardware acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Install and verify the Android application on an emulator
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 6144M
          disk-size: 8G
          working-directory: 12-AZ-IP/46-axiomzero-android-suite
          script: bash ../../.github/scripts/verify-android-suite.sh
      - name: Preserve Android test and lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axiomzero-android-suite-validation
          path: |
            12-AZ-IP/46-axiomzero-android-suite/app/build/reports/
            12-AZ-IP/46-axiomzero-android-suite/app/build/outputs/androidTest-results/
            12-AZ-IP/46-axiomzero-android-suite/build/device-verification/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: axiomzero-android-suite-debug
          path: 12-AZ-IP/46-axiomzero-android-suite/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
