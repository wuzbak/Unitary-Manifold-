name: CodeQL Language Matrix

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-full:
    name: Analyze Python repository-wide
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize full Python CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          build-mode: none
          config: |
            paths-ignore:
              - .github/agents
      - name: Analyze full Python database
        uses: github/codeql-action/analyze@v3
        with:
          threads: 2
          ram: 5500
          category: "/language:python/repository-wide"
          output: .um-arts/codeql-python
      - name: Preserve Python SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-python-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: .um-arts/codeql-python/
          include-hidden-files: true
          if-no-files-found: warn

  plan-matrix:
    name: Plan changed-surface matrix
    runs-on: ubuntu-latest
    outputs:
      has_work: ${{ steps.plan.outputs.has_work }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every tracked source file belongs to a slice
        run: python3 TOOLS/checks/codeql_slices.py check
      - name: Build language/slice matrix
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          : > changed_files.txt
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            git fetch origin "$BASE_REF" --depth=1 || true
            git diff --name-only "origin/$BASE_REF...HEAD" > changed_files.txt || : > changed_files.txt
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "${BEFORE_SHA//0/}" != "" ]; then
            git diff --name-only "$BEFORE_SHA" HEAD > changed_files.txt || : > changed_files.txt
          fi
          # An empty change list (schedule, manual run, unknown base) analyses every slice.
          python3 TOOLS/checks/codeql_slices.py plan --changed-from changed_files.txt \
            --github-output "$GITHUB_OUTPUT" --manifest-out codeql_pr_scope_manifest.json
      - name: Upload PR scope manifest
        uses: actions/upload-artifact@v4
        with:
          name: codeql-pr-scope-manifest
          path: codeql_pr_scope_manifest.json
          if-no-files-found: error

  duckdb-preflight:
    name: DuckDB preflight inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build code inventory telemetry
        run: |
          python -m pip install --upgrade pip
          pip install duckdb
          python3 - <<'PY'
          import json
          from pathlib import Path
          import duckdb

          root = Path(".")
          tracked = []
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              rel = path.as_posix()
              if rel.startswith(".git/"):
                  continue
              tracked.append((rel, path.suffix.lower(), path.stat().st_size))

          con = duckdb.connect()
          con.execute("CREATE TABLE files(path VARCHAR, ext VARCHAR, bytes BIGINT)")
          con.executemany("INSERT INTO files VALUES (?, ?, ?)", tracked)

          language = con.execute(
              """
              SELECT
                CASE
                  WHEN ext = '.py' THEN 'python'
                  WHEN ext IN ('.rs', '.toml') THEN 'rust'
                  WHEN ext IN ('.c', '.cc', '.cpp', '.cxx', '.h', '.hpp') THEN 'c-cpp'
                  WHEN ext IN ('.java', '.kt', '.kts') THEN 'java-kotlin'
                  ELSE 'other'
                END AS language,
                COUNT(*) AS file_count,
                SUM(bytes) AS total_bytes
              FROM files
              GROUP BY 1
              ORDER BY total_bytes DESC
              """
          ).fetchall()

          domains = con.execute(
              """
              SELECT
                split_part(path, '/', 1) AS top_domain,
                COUNT(*) AS file_count,
                SUM(bytes) AS total_bytes
              FROM files
              GROUP BY 1
              ORDER BY total_bytes DESC
              LIMIT 20
              """
          ).fetchall()

          payload = {
              "language_summary": [
                  {"language": row[0], "file_count": int(row[1]), "total_bytes": int(row[2] or 0)}
                  for row in language
              ],
              "domain_summary": [
                  {"top_domain": row[0], "file_count": int(row[1]), "total_bytes": int(row[2] or 0)}
                  for row in domains
              ],
          }
          Path("codeql_slice_inventory.json").write_text(json.dumps(payload, indent=2), encoding="utf-8")
          print("Generated codeql_slice_inventory.json")
          PY
      - name: Upload preflight artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-slice-inventory
          path: codeql_slice_inventory.json
          if-no-files-found: error

  analyze:
    name: Analyze ${{ matrix.language }} · ${{ matrix.slice_id }}
    needs: [plan-matrix, duckdb-preflight]
    if: needs.plan-matrix.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
          queries: security-extended
          config: ${{ matrix.config }}
      - name: Autobuild
        if: matrix.build_mode == 'autobuild'
        uses: github/codeql-action/autobuild@v3
      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}/slice:${{ matrix.slice_id }}"
