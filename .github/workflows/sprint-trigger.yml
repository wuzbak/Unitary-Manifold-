name: Weekly Sprint Trigger

on:
  schedule:
    # Every Sunday at 00:00 UTC — the autonomous stewardship clock
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual trigger reason (optional)"
        required: false
        default: "Manual trigger"

permissions:
  issues: write
  contents: read

jobs:
  create-sprint-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract frontier state
        id: frontier
        run: |
          python3 - <<'EOF'
          import datetime
          import os
          import re
          import sys

          # --- Read machine-readable frontier state from mas_tracker.yml ---
          with open("docs/mas_tracker.yml", "r") as f:
              tracker = f.read()

          version_match = re.search(r'version:\s*"([^"]+)"', tracker)
          if not version_match:
              sys.exit("Could not extract current version from docs/mas_tracker.yml")
          version = version_match.group(1)

          version_key_prefix = f"{version.replace('.', '_')}_"
          lines = tracker.splitlines()
          block_start = None
          for i, line in enumerate(lines):
              if line.startswith(version_key_prefix) and line.endswith(":"):
                  block_start = i + 1
                  break
          if block_start is None:
              sys.exit(f"Could not locate current sprint block for {version} in docs/mas_tracker.yml")

          next_slot = None
          for line in lines[block_start:]:
              if line and not line.startswith(" "):
                  break
              match = re.match(r"\s{2}next_pillar_slot:\s*(\d+)\s*$", line)
              if match:
                  next_slot = int(match.group(1))
                  break
          if next_slot is None:
              sys.exit(f"Could not extract next_pillar_slot for {version} from docs/mas_tracker.yml")

          # --- Derive week label ---
          today = datetime.date.today()
          week = today.strftime("%Y-%m-%d")

          # --- Write outputs ---
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"next_slot={next_slot}\n")
              out.write(f"version={version}\n")
              out.write(f"week={week}\n")

          print(f"next_slot={next_slot}, version={version}, week={week}")
          EOF

      - name: Create sprint trigger issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_SLOT: ${{ steps.frontier.outputs.next_slot }}
          VERSION: ${{ steps.frontier.outputs.version }}
          WEEK: ${{ steps.frontier.outputs.week }}
        run: |
          cat > /tmp/sprint_body.md << BODY
          ## [SPRINT TRIGGER] — Week of ${WEEK}

          **Current version:** ${VERSION}
          **Next pillar slot:** ${NEXT_SLOT}

          ---

          ### Machine-readable frontier block

          \`\`\`yaml
          sprint_trigger:
            week: "${WEEK}"
            version: "${VERSION}"
            next_pillar_slot: ${NEXT_SLOT}
            physics_frontier_priorities:
              1: CMB_PEAK3_5D_EFT_CLOSURE          # 3.1σ peak-3 residual; next: EFT correction at ℓ~800
              2: ARXIV_V15_ENGAGEMENT               # external reviewer outreach follow-up
              completed_v15_3:
                - PMNS_PR_FULL_CHAIN                 # P503 synchronized; residual retained
                - LATTICE_BRAID_PHASE4_NP_CONDENSATE # P504 bounded; external HMC not claimed
                - SIXD_BARYOGENESIS_PHASE3_NEDM      # P505 precision certificate
                - LHC_GLUON_CHANNEL_FORMAL_AUDIT     # P506 formal audit complete
            active_decision_windows:
              DESI_DR3:   { expected: "2026",      tripwire: "wₐ<-0.3 at ≥3σ → ARCHITECTURE_LIMIT_EXCEEDED" }
              SO_DR1:     { expected: "2027",      tripwire: "r<0.026 at ≥2σ → ROUTING per P368" }
              SPHEREx:    { expected: "2027-2028", tripwire: "f_NL outside [-2.9,-0.2] at ≥2σ → TENSION" }
              HL_LHC:     { expected: "2029-2033", tripwire: "G_KK < 5 TeV excluded → RE-ROUTE" }
              LiteBIRD:   { expected: "~2032",     tripwire: "β outside [0.22,0.38]° at ≥3σ → FALSIFIED" }
            hard_constraints:
              - zero_test_failures_required: true
              - no_pillar_without_test_file: true
              - admissions_honest_labeling: true
              - truth_surface_sync_required: true
              - outreach_post_per_sprint: true
          \`\`\`

          ---

          ### Sprint protocol (STEWARDSHIP.md §3)

          1. **Phase A — Frontier assessment:** read STATUS.md, FALLIBILITY.md, CLAIM_MASTER_BOARD.md, mas_tracker.yml; write one-page frontier memo in PR description
          2. **Phase B — Physics implementation:** 3–7 pillars, each with Python module + test file (≥30 tests) + status dict + truth surface updates
          3. **Phase C — Full regression:** `python3 -m pytest tests/ recycling/ "5-GOVERNANCE/Unitary Pentad/" -q --tb=short` — must pass 0 failures
          4. **Phase D — Truth surface sync:** STATUS.md, CLAIM_MASTER_BOARD.md, TRUTH_LAYER.md, GATEKEEPER_SUMMARY.md, OBSERVATION_TRACKER.md, mas_tracker.yml
          5. **Phase E — Outreach:** Substack post in steward's voice; arXiv update if major closure

          **Escalation conditions** (tag @wuzbak, halt routine sprints):
          - CI fails 2 consecutive weeks
          - Falsifier fires at ≥3σ contradiction with canonical prediction
          - External party requests formal institutional response
          - Legal or licensing question

          ---

          @github-copilot Please execute the next autonomous sprint per the STEWARDSHIP.md protocol. Begin with Phase A frontier assessment.
          BODY

          gh issue create \
            --title "[SPRINT TRIGGER] Week of ${WEEK} — Pillar slot ${NEXT_SLOT}" \
            --body-file /tmp/sprint_body.md \
            --label "sprint-trigger" \
            --repo "${{ github.repository }}"
