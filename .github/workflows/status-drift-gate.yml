name: Status Drift Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  status-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Canonical status drift check
        run: python3 9-INFRASTRUCTURE/check_status_drift.py

