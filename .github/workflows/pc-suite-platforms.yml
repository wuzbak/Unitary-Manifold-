name: PC Suite Platform Artifacts

on:
  pull_request:
    paths:
      - ".github/workflows/pc-suite-platforms.yml"
      - ".github/workflows/android-suite-build.yml"
      - ".github/scripts/verify-android-suite.sh"
      - "12-AZ-IP/02-az-kernel/**"
      - "12-AZ-IP/14-sdam/**"
      - "12-AZ-IP/15-pentacorder/**"
      - "12-AZ-IP/45-axiomzero-pc-suite/lib/platform-targets.cjs"
      - "12-AZ-IP/45-axiomzero-pc-suite/tests/platform-targets.test.cjs"
      - "12-AZ-IP/46-axiomzero-android-suite/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  android-suite:
    name: Product 46 Android build and device tests
    uses: ./.github/workflows/android-suite-build.yml

  android:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android-sdam
            project: 12-AZ-IP/14-sdam/app
          - target: android-pentacorder
            project: 12-AZ-IP/15-pentacorder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build actual Android applications with verified Gradle distribution
        env:
          ANDROID_PROJECT: ${{ matrix.project }}
          ANDROID_TARGET: ${{ matrix.target }}
        run: |
          $checksum = (Invoke-RestMethod -Uri "https://services.gradle.org/distributions/gradle-8.6-bin.zip.sha256" -TimeoutSec 60).Trim()
          if ($checksum -cnotmatch "^[a-f0-9]{64}$") { throw "Invalid official Gradle checksum response." }
          $project = $env:ANDROID_PROJECT
          Add-Content "$project/gradle/wrapper/gradle-wrapper.properties" "`ndistributionSha256Sum=$checksum" -Encoding ascii
          Push-Location $project
          try {
            .\gradlew.bat --no-daemon --continue assembleDebug
            if ($LASTEXITCODE -ne 0) { throw "Actual Android build failed: $project" }
          } finally { Pop-Location }
          New-Item -ItemType Directory -Force platform-output | Out-Null
          Copy-Item "$project/app/build/outputs/apk/debug/app-debug.apk" "platform-output/$($env:ANDROID_TARGET).apk"
      - uses: actions/upload-artifact@v4
        with:
          name: pc-suite-${{ matrix.target }}-artifact
          path: platform-output/*.apk
          if-no-files-found: error

  uefi:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build actual x64 UEFI application without firmware changes
        working-directory: 12-AZ-IP/02-az-kernel
        run: |
          cargo build --locked --release --target x86_64-unknown-uefi
          if ($LASTEXITCODE -ne 0) { throw "Actual UEFI build failed." }
      - uses: actions/upload-artifact@v4
        with:
          name: pc-suite-uefi-artifact
          path: 12-AZ-IP/02-az-kernel/target/x86_64-unknown-uefi/release/az-kernel.efi
          if-no-files-found: error

  android-launch-smoke:
    name: Launch Products 14 and 15 on an Android emulator
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pc-suite-android-sdam-artifact
          path: platform-output
      - uses: actions/download-artifact@v4
        with:
          name: pc-suite-android-pentacorder-artifact
          path: platform-output
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Enable emulator hardware acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Install and launch the actual Android activities
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        env:
          P45_ANDROID_EMULATOR_SERIAL: emulator-5554
          P45_ANDROID_SDAM_APK: ${{ github.workspace }}/platform-output/android-sdam.apk
          P45_ANDROID_PENTACORDER_APK: ${{ github.workspace }}/platform-output/android-pentacorder.apk
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: P45_ANDROID_ADB="$ANDROID_HOME/platform-tools/adb" node --test --test-name-pattern="real emulator installs and launches" 12-AZ-IP/45-axiomzero-pc-suite/tests/platform-targets.test.cjs

  bundle:
    needs: [android, uefi]
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pc-suite-android-sdam-artifact
          path: platform-output
      - uses: actions/download-artifact@v4
        with:
          name: pc-suite-android-pentacorder-artifact
          path: platform-output
      - uses: actions/download-artifact@v4
        with:
          name: pc-suite-uefi-artifact
          path: uefi-output
      - name: Bind all platform artifacts to actual hashes
        run: |
          Move-Item uefi-output/az-kernel.efi platform-output/uefi-az-kernel.efi
          $assets = foreach ($target in @("android-sdam", "android-pentacorder", "uefi-az-kernel")) {
            $extension = if ($target -eq "uefi-az-kernel") { "efi" } else { "apk" }
            $file = "$target.$extension"
            $item = Get-Item -LiteralPath "platform-output/$file"
            if ($item.Length -lt 1 -or $item.Length -gt 268435456) { throw "Invalid platform artifact byte length." }
            [ordered]@{
              target = $target; file = $file; sizeBytes = $item.Length
              sha256 = (Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          [ordered]@{ formatVersion = 1; assets = @($assets) } | ConvertTo-Json -Depth 5 |
            Set-Content platform-output/manifest.json -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: pc-suite-platform-targets
          path: platform-output/
          if-no-files-found: error
