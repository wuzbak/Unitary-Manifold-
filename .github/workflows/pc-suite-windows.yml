name: AxiomZero PC Suite Windows Build

on:
  pull_request:
    paths:
      - ".github/workflows/pc-suite-windows.yml"
      - ".github/workflows/pc-suite-embedded-model.yml"
      - ".github/workflows/pc-suite-platforms.yml"
      - ".github/workflows/android-suite-build.yml"
      - ".github/scripts/verify-android-suite.sh"
      - "12-AZ-IP/**"
      - "src/**"
      - "bot/__init__.py"
      - "bot/assistant_api.py"
      - "bot/rag_index.py"
      - "bot/session_bootstrap.py"
      - "bot/research_resources.py"
      - "claims/**"
      - "recycling/**"
      - "5-GOVERNANCE/Unitary Pentad/**"
      - "README.md"
      - "FALLIBILITY.md"
      - "requirements*.txt"
  workflow_dispatch:
  push:
    tags:
      - "pc-suite-v*"

permissions:
  contents: read

jobs:
  instruction-backend:
    uses: ./.github/workflows/pc-suite-embedded-model.yml

  platform-artifacts:
    uses: ./.github/workflows/pc-suite-platforms.yml

  recovered-python-products:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install recovered product test dependencies
        run: |
          $installArgs = @(
            "-m"
            "pip"
            "install"
            "--retries"
            "5"
            "--timeout"
            "60"
            "-r"
            "12-AZ-IP/20-psicat-navigator/requirements.txt"
            "pytest>=8.0,<9.1"
            "pytest-asyncio"
            "fastapi"
            "python-multipart"
            "pyyaml"
            "z3-solver"
          )
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            python @installArgs
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          exit $LASTEXITCODE
      - name: Execute slow-inclusive recovered product suites on Windows
        run: >-
          python -m pytest
          12-AZ-IP/01-axiom-os/tests/
          12-AZ-IP/20-psicat-navigator/tests/
          12-AZ-IP/35-az-uos-kernel-bridge/tests/
          12-AZ-IP/38-az-formal-verification-library/tests/
          12-AZ-IP/39-az-research-debt-tracker/tests/
          -q -m "slow or not slow" --junitxml=recovered-python-products.xml
      - name: Upload native recovered-product results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovered-python-products-windows
          path: recovered-python-products.xml
          if-no-files-found: warn

  eige-native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install EIGE dependencies
        run: python -m pip install -r 12-AZ-IP/03-eige/requirements.txt
      - name: Exercise durable custody, signing and bundle verification on Windows
        env:
          PYTHONPATH: ${{ github.workspace }}/12-AZ-IP/03-eige
          PYTHONCASEOK: "1"
        run: >-
          python -m pytest
          12-AZ-IP/03-eige/tests/test_eige_scale_ingest.py
          12-AZ-IP/03-eige/tests/test_eige_scale_verify.py
          12-AZ-IP/03-eige/tests/test_eige_v22_ledger.py
          12-AZ-IP/03-eige/tests/test_eige_v22_open_data.py
          -q

  browser-desktop-runtime:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 12-AZ-IP/24-psicat-web-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 12-AZ-IP/24-psicat-web-browser/package-lock.json
      - name: Exercise installer-kit helper using synthetic downloads in Windows PowerShell 5.1
        shell: powershell
        working-directory: 12-AZ-IP/45-axiomzero-pc-suite
        run: |
          $env:P45_POWERSHELL = "powershell.exe"
          node --test tests/download-installer-kit.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Installer-kit helper verification failed." }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - run: node node_modules/electron/install.js
      - name: Verify inherited Electron IPC before provisioning Python
        run: node tests/run-ipc-probe.js
      - run: python -m pip install -r ../20-psicat-navigator/requirements.txt
      - name: Exercise native Windows desktop readiness and cleanup
        env:
          PSICAT_BROWSER_ELECTRON_TEST: "1"
        run: |
          node --test --test-reporter=junit --test-reporter-destination=desktop-runtime.xml tests/desktop-runtime.test.js
          if ($LASTEXITCODE -ne 0) {
            throw "Native Windows browser runtime test failed."
          }
          [xml]$report = Get-Content desktop-runtime.xml -Raw
          if ($report.SelectNodes("//testcase").Count -eq 0 -or $report.SelectNodes("//skipped").Count -ne 0) {
            throw "Native Windows browser runtime verification must execute without skips."
          }
      - name: Upload native browser test diagnostics
        if: always() && hashFiles('12-AZ-IP/24-psicat-web-browser/desktop-runtime.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: psicat-browser-windows-runtime-report
          path: 12-AZ-IP/24-psicat-web-browser/desktop-runtime.xml
          if-no-files-found: error

  test-and-package:
    needs: [browser-desktop-runtime, instruction-backend, platform-artifacts, recovered-python-products, eige-native]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 12-AZ-IP/45-axiomzero-pc-suite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 12-AZ-IP/45-axiomzero-pc-suite/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: psicat-instruction-runtime
          path: 12-AZ-IP/45-axiomzero-pc-suite/build/instruction
      - uses: actions/download-artifact@v4
        with:
          name: pc-suite-platform-targets
          path: 12-AZ-IP/45-axiomzero-pc-suite/build/platform-targets
      - run: python -m pip install -r requirements-native-build.txt
      - run: npm test
      - run: npm run catalog:check
      - run: npm run dist:win
      - run: npm run smoke:win
      - name: Reverify all offline payload parts and write full release checksums
        run: npm run payload:verify
      - name: Attach user-executed downloader with release checksum coverage
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $name = "AxiomZero-PC-Suite-$version-download.ps1"
          Copy-Item -LiteralPath scripts/download-installer-kit.ps1 -Destination "dist/$name"
          $hash = (Get-FileHash -LiteralPath "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content -LiteralPath dist/SHA256SUMS.txt -Value "$hash  $name" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: axiomzero-pc-suite-windows
          path: |
            12-AZ-IP/45-axiomzero-pc-suite/dist/*.exe
            12-AZ-IP/45-axiomzero-pc-suite/dist/*-offline.json
            12-AZ-IP/45-axiomzero-pc-suite/dist/*-model.part*
            12-AZ-IP/45-axiomzero-pc-suite/dist/*-download.ps1
            12-AZ-IP/45-axiomzero-pc-suite/dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/pc-suite-v')
    needs: test-and-package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: axiomzero-pc-suite-windows
          path: 12-AZ-IP/45-axiomzero-pc-suite/dist
      - name: Validate release tag and publish artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $packagePath = "12-AZ-IP/45-axiomzero-pc-suite/package.json"
          $distPath = "12-AZ-IP/45-axiomzero-pc-suite/dist"
          $packageVersion = (Get-Content $packagePath -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "pc-suite-v$packageVersion") {
            throw "Release tag must match package version pc-suite-v$packageVersion."
          }
          $artifacts = Get-ChildItem -Path $distPath -File |
            Where-Object { $_.Extension -eq ".exe" -or $_.Name -like "*-offline.json" -or $_.Name -match "-model\.part[0-9]{3}$" -or $_.Name -like "*-download.ps1" -or $_.Name -eq "SHA256SUMS.txt" } |
            ForEach-Object { $_.FullName }
          if (-not $artifacts) {
            throw "No Windows release artifacts were produced."
          }
          $checksums = Get-Content -LiteralPath "$distPath/SHA256SUMS.txt"
          foreach ($line in $checksums) {
            if ($line -cnotmatch '^([a-f0-9]{64})  (AxiomZero-PC-Suite-[a-zA-Z0-9.-]+)$') {
              throw "Invalid release checksum entry."
            }
            $expectedHash = $Matches[1]
            $asset = Get-Item -LiteralPath (Join-Path $distPath $Matches[2])
            if ($asset.Length -ge 2GB -or (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expectedHash) {
              throw "Release asset exceeded 2 GiB or failed checksum verification."
            }
          }
          if ($checksums.Count -ne ($artifacts.Count - 1)) { throw "Release checksums do not cover every asset." }
          gh release create "$env:GITHUB_REF_NAME" $artifacts --title "$env:GITHUB_REF_NAME — AxiomZero PC Suite (Windows x64 test build)" --notes-file "12-AZ-IP/45-axiomzero-pc-suite/README.md" --prerelease --verify-tag
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed." }
