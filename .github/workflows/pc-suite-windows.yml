name: AxiomZero PC Suite Windows Build

on:
  pull_request:
    paths:
      - ".github/workflows/pc-suite-windows.yml"
      - "12-AZ-IP/45-axiomzero-pc-suite/**"
      - "12-AZ-IP/43-az-geometric-tori-transformer/**"
      - "12-AZ-IP/LICENSE-AGPL"
      - "12-AZ-IP/NOTICE"
      - "12-AZ-IP/PORTFOLIO_LICENSE_SCHEDULE.md"
  workflow_dispatch:
  push:
    tags:
      - "pc-suite-v*"

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 12-AZ-IP/45-axiomzero-pc-suite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 12-AZ-IP/45-axiomzero-pc-suite/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -r requirements-native-build.txt
      - run: npm test
      - run: npm run catalog:check
      - run: npm run dist:win
      - run: npm run smoke:win
      - name: Write artifact checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File -Filter *.exe |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: axiomzero-pc-suite-windows
          path: |
            12-AZ-IP/45-axiomzero-pc-suite/dist/*.exe
            12-AZ-IP/45-axiomzero-pc-suite/dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/pc-suite-v')
    needs: test-and-package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: axiomzero-pc-suite-windows
          path: 12-AZ-IP/45-axiomzero-pc-suite/dist
      - name: Validate release tag and publish artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $packagePath = "12-AZ-IP/45-axiomzero-pc-suite/package.json"
          $distPath = "12-AZ-IP/45-axiomzero-pc-suite/dist"
          $packageVersion = (Get-Content $packagePath -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "pc-suite-v$packageVersion") {
            throw "Release tag must match package version pc-suite-v$packageVersion."
          }
          $artifacts = Get-ChildItem -Path $distPath -File |
            Where-Object { $_.Extension -eq ".exe" -or $_.Name -eq "SHA256SUMS.txt" } |
            ForEach-Object { $_.FullName }
          if (-not $artifacts) {
            throw "No Windows release artifacts were produced."
          }
          gh release create "$env:GITHUB_REF_NAME" $artifacts --title "AxiomZero PC Suite $env:GITHUB_REF_NAME" --notes-file "12-AZ-IP/45-axiomzero-pc-suite/README.md"
