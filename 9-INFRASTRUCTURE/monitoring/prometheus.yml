# 9-INFRASTRUCTURE/monitoring/prometheus.yml
# Prometheus scrape configuration for the Unitary Manifold services
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "axiomzero"
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: /metrics

  - job_name: "um-sos"
    static_configs:
      - targets: ["host.docker.internal:8001"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
