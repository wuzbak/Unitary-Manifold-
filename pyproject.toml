# pyproject.toml — PEP 517/518 build configuration for the Unitary Manifold
# Install (development): pip install -e .
# Install (production):  pip install .
# After installation:    from unitary_manifold.core import metric

[build-system]
requires = ["setuptools>=78.1.1", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name = "unitary-manifold"
version = "11.12.0"
description = "5D Kaluza-Klein physics framework: geometry of irreversibility, CMB predictions, and Standard Model derivation"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "ThomasCory Walker-Pearson" },
]
keywords = [
    "kaluza-klein", "extra-dimensions", "cmb", "cosmology",
    "theoretical-physics", "irreversibility", "holography",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.11,<2",
    "mpmath>=1.3,<2",
    "duckdb>=1.5",
    "polars>=1.44",
    "pyarrow>=25.0",
    "zarr>=3.3",
]

[project.optional-dependencies]
symbolic = [
    "sympy>=1.12,<2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "playwright>=1.44",
    "mypy>=1.9",
    "ruff>=0.4",
    "black>=24.0",
    "pre-commit>=3.7",
    "pip-audit>=2.7",
    "detect-secrets>=1.4",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]
notebooks = [
    "matplotlib>=3.7,<4",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]
api = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "httpx>=0.27,<1",
    "aiofiles>=23.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "anyio>=4.3",
    "slowapi>=0.1.9",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "prometheus-client>=0.20",
    "websockets>=12.0",
    "structlog>=24.1",
]
um_sos = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
]
ai = [
    "langgraph>=0.1",
    "langchain-community>=0.2",
    "langchain-ollama>=0.1",
    "chromadb>=0.5",
    "sentence-transformers>=2.7",
]
polyglot = [
    "juliacall>=0.9.35",
    "duckdb>=1.5.5",
    "polars>=1.44.1",
    "pyarrow>=25.0.1",
    "zarr>=3.3.0",
]
observability = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "prometheus-client>=0.20",
]
android = [
    "httpx>=0.27",
    "rich>=13.7",
]
full = [
    "unitary-manifold[dev,notebooks,symbolic,um_sos,api,ai,observability,polyglot]",
]
all = [
    "unitary-manifold[full]",
]

[project.urls]
Homepage = "https://github.com/wuzbak/Unitary-Manifold-"
Repository = "https://github.com/wuzbak/Unitary-Manifold-"
"Bug Tracker" = "https://github.com/wuzbak/Unitary-Manifold-/issues"
DOI = "https://doi.org/10.5281/zenodo.19584531"

# ---------------------------------------------------------------------------
# Package discovery
# Ship src/ alongside the unitary_manifold namespace shim.  Both public
# unitary_manifold.* imports and legacy src.* imports use the same source
# files in editable installs and wheels.
# ---------------------------------------------------------------------------
[tool.setuptools]
license-files = ["LICENSE", "LICENSE-AGPL", "NOTICE", "LICENSES/AGPL-3.0-or-later.txt"]

[tool.setuptools.packages.find]
where = [".", "5-GOVERNANCE/Unitary Pentad"]
include = ["unitary_manifold*", "src", "src.*", "omega*", "holon_zero*", "UOS*"]
namespaces = false

[tool.setuptools.package-data]
"src.data_feeds" = ["latest_snapshot.json"]

# ---------------------------------------------------------------------------
# pytest configuration is in pytest.ini (canonical config)
# ---------------------------------------------------------------------------
