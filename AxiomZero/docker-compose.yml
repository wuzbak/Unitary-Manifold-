# AxiomZero supporting services: ChromaDB vector store

services:
  chroma:
    image: chromadb/chroma:latest
    container_name: axiomzero-chroma
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=False
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

  qdrant:
    image: qdrant/qdrant:latest
    container_name: axiomzero-qdrant
    restart: unless-stopped
    profiles:
      - qdrant  # Only started when: docker compose --profile qdrant up
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  axiomzero:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: axiomzero-api
    restart: unless-stopped
    profiles:
      - full  # Only started when: docker compose --profile full up
    ports:
      - "8000:8000"
    volumes:
      - ../:/app/repo:ro          # Repository (read-only)
      - ~/.axiomzero:/app/state   # Persistent state (R/W)
    environment:
      - AXIOMZERO_VECTORDB_URL=http://chroma:8000
      - AXIOMZERO_REPO_ROOT=/app/repo
      - AXIOMZERO_STATE_DIR=/app/state
    depends_on:
      chroma:
        condition: service_healthy

volumes:
  chroma_data:
    name: axiomzero_chroma_data
  qdrant_data:
    name: axiomzero_qdrant_data
