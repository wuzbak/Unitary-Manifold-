# EIGE v21.0 — State Aggregation Mesh Deployment
# AxiomZero Technologies & Consulting, SPC
# Theory & scientific direction: ThomasCory Walker-Pearson
# Code architecture & synthesis:  GitHub Copilot (AI)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eige-state-mesh
  namespace: eige-prod
  labels:
    app: eige-state
    version: "21.0.0"
    tier: state
spec:
  replicas: 3
  selector:
    matchLabels:
      app: eige-state
  template:
    metadata:
      labels:
        app: eige-state
        version: "21.0.0"
        tier: state
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: eige-state-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: state-mesh
          image: axiomzero/eige-state:21.0.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: K_CS
              value: "74"
            - name: COUNTY_COUNT
              value: "39"
            - name: HOLON_CERT_INTERVAL_SECONDS
              value: "300"
            - name: AGGREGATE_HASH_ALGORITHM
              value: "sha512"
            - name: STATE_ID
              value: "WA"
          ports:
            - name: grpc-aggregate
              containerPort: 50052
              protocol: TCP
            - name: http-api
              containerPort: 8081
              protocol: TCP
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: ledger-vol
              mountPath: /var/eige/ledger
            - name: cert-vol
              mountPath: /var/eige/certs
            - name: tmp-vol
              mountPath: /tmp
      volumes:
        - name: ledger-vol
          persistentVolumeClaim:
            claimName: eige-ledger-pvc
        - name: cert-vol
          persistentVolumeClaim:
            claimName: eige-cert-pvc
        - name: tmp-vol
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: eige-state-mesh-svc
  namespace: eige-prod
spec:
  selector:
    app: eige-state
  ports:
    - name: grpc-aggregate
      port: 50052
      targetPort: 50052
    - name: http-api
      port: 8081
      targetPort: 8081
  type: ClusterIP
