repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=5120"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3.12

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --no-error-summary]
        additional_dependencies: [types-all]
        pass_filenames: false
        entry: mypy src/ AxiomZero/

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: "tests/"

  - repo: local
    hooks:
      - id: psicat-training-execution-trace-scan
        name: PsiCat training_execution trace scan
        entry: python 12-AZ-IP/20-psicat-navigator/tools/check_training_execution_traces.py
        language: system
        pass_filenames: false
      - id: sync-repository-maps
        name: Regenerate COMPACTIFICATION repository maps
        description: >-
          Keeps COMPACTIFICATION/monorepo_map.json and kernel_map.json in
          sync with the tracked file inventory so CI's
          test_maps_match_repository_inventory gate never goes stale.
        entry: python COMPACTIFICATION/build_maps.py
        language: system
        pass_filenames: false
        always_run: true
